<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2 class="sidebar-title">Filters</h2>
            <ul class="filter-list">
                <li class="filter-item active" data-filter="all">
                    <span class="filter-label">All</span>
                    <span class="filter-count" data-count="all">0</span>
                </li>
                <li class="filter-item" data-filter="todo">
                    <span class="filter-label">To Do</span>
                    <span class="filter-count" data-count="todo">0</span>
                </li>
                <li class="filter-item" data-filter="in-progress">
                    <span class="filter-label">In Progress</span>
                    <span class="filter-count" data-count="in-progress">0</span>
                </li>
                <li class="filter-item" data-filter="done">
                    <span class="filter-label">Done</span>
                    <span class="filter-count" data-count="done">0</span>
                </li>
            </ul>
        </aside>
        <div class="container">
            <h1>To-Do List</h1>
            <p class="subtitle">Stay organized, stay productive</p>
            <div class="input-container">
                <input type="text" id="todo-input" placeholder="Add a new task...">
                <button id="add-btn">+</button>
            </div>
            <div class="task-count" id="task-count"></div>
            <ul id="todo-list">
                <li class="empty-state" id="empty-state">
                    <span class="icon">✓</span>
                    No tasks yet. Add one above!
                </li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
